; Redo of 2026-09-03 with the corrected GWTC-4/5 PE prior (see
; notes/2026-09-03-gwtc45-pe-prior-fix.md); the previous run is in runs/bad_z_prior/.
;
; Real GWTC-5 catalog inference: 259 LVK events, PISN mass model with the
; LVK-style normalized q^beta pairing (pairing = lvk), cosmology fixed
; (h/Om/w).  MPISNDOT RUN: identical to realGWTC5_noevo_259ev_qpair EXCEPT
; that the redshift evolution of the PISN mass scale is turned ON:
; mpisndot ~ Uniform(-2, 8) instead of fixed to 0, with the pivot
; parametrization (mpisn_ref sampled at zpivot = 0.75, tightened bounds
; low=23.5) as in gwtc5_fullcosmo_evo_pivot_fpeak_w15.prior; see
; notes/2026-08-09-pivot-reparam.md.  "noevo" is kept in the name for
; family traceability even though the mass scale now evolves.
;
; Data: PE_GWTC5_259ev.h5 (259 events x 7000; exact LVK GWTC-5 Default event
; list from the popsummary release; small-sample events drawn from
; C01:IMRPhenomXPHM via group_overrides -- zero with-replacement rows) and
; sel_GWTC5_fixed.h5 (fixed selection normalization, 1,433,314 rows,
; ndraw = 1,568,035,640).  Both are SYMLINKS into runs/realGWTC5_noevo_259ev/,
; which remains the single provenance copy (see
; run_configs/realGWTC5_noevo_fullsel_259ev.ini for how it was built).
;
; No pop_config_file: real data, NUTS init_to_sample.
;
; Run (from scripts/):
;   sbatch call_inf_qpair_mpisndot.sh

[run]
run_dir = realGWTC5_noevo_259ev_qpair_mpisndot
output_file_PE = PE_GWTC5_259ev.h5
output_sel_file = sel_GWTC5_fixed.h5
prior = real_dat_noevo_qpair_mpisndot_r.prior
tail_anchor = ref_z
pairing = lvk
nmcmc = 1800
nchain = 4
evt_start = 0
evt_end = None
mcmc_out = realGWTC5_noevo_259ev_qpair_mpisndot.nc
max_tree_depth = 7
dense_mass = false
target_accept_prob = 0.8
use_low_bump = true
smooth_tail_edge = true

; Explicit float32-recentering reference point (see
; notes/2026-08-31-recentering-reference-fix.md): posterior MEDIANS of the
; healthy fixed-h baseline runs/realGWTC5_noevo_259ev_qpair (rounded to 4
; significant figures), plus mpisndot = 0.0 (the baseline's fixed value).
; This run's original seed-0 prior draw happened to be healthy; the section
; pins the reference against future RNG-stream shifts.  Only SAMPLED sites
; of real_dat_noevo_qpair_mpisndot_r.prior may appear here (h is fixed in
; that prior, so no h line).
[ref_params]
a = 1.264
b = 1.170
c = 4.844
mpisn_ref = 33.04
mpisndot = 0.0
dmbhmax = 3.267
sigma = 0.1063
beta = 2.522
lam = 2.258
dkappa = 3.243
zp = 1.877
mp_low = 9.895
msigma_low = 0.6435
log_fpeak = 1.136
log_r = -0.7533
