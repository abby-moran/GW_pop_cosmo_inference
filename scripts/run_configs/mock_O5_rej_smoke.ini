; Smoke test of the rejection-sampling path in reweight_res.py.
; Reuses the endO5_val injection file (symlinked); reads only 4M rows.
; num_tot is left at 2e7 on purpose to exercise the pool-exhaustion warning.
[run]
pop_config_file = mock_O5_noevo.txt
output_file_inj = inj_mockGW5_SNR0.h5
ndet = 3
final_snr_threshold = 8
snr_threshold_0 = 0
sensitivity = 'aplus_PSD'
run_dir = endO5_rej_smoke
ini_file = mock_O5_rej_smoke.ini
snr_grid = snr_grid_aplus.npz
chunk_size = 1000000
num_tot    = 20000000
n_total    = 4000000
n_pe = 4000
obs_file = obs_noevo.h5
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
write_obs = True
new_sel = True
prior = gwtc5_cosmo.prior
nmcmc = 1800
nchain = 2
jitter_snr = True
m_min = 5.5
evt_start = 0
evt_end = 9000
mcmc_out = O5_rej_smoke.nc
