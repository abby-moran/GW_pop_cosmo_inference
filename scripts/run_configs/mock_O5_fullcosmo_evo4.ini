; Same setup as endO5_fullcosmo_evo3 (h, Omh2, w, mpisndot free; dense_mass;
; max_tree_depth=10) but running the scatter-free VJP path from
; notes/2026-08-09-scatter-free-vjp.md (local/opt-pass-3).  Separate run_dir
; and mcmc_out so this job cannot overwrite evo3 outputs.  Same endO5_val2
; data symlinks and prior for an apples-to-apples speed/mixing comparison.
[run]
pop_config_file = mock_O5_noevo.txt
run_dir = endO5_fullcosmo_evo4
ini_file = mock_O5_fullcosmo_evo4.ini
n_pe = 4000
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
prior = gwtc5_fullcosmo_evo.prior
nmcmc = 1800
nchain = 2
evt_start = 0
evt_end = 9000
mcmc_out = O5_fullcosmo_evo4.nc
max_tree_depth = 10
dense_mass = true
