; Real GWTC-5 catalog inference, no evolution (mpisndot = 0), cosmology fixed.
; Identical to realGWTC5_noevo_fullsel except that the selection file is
; regenerated with the FIXED weighting.extract_selection_samples
; (fix-selection-normalization branch): full 13-search FAR mask plus the
; semianalytic snr>10 O1/O2 epochs, cut on TRUE mass2_source > 2.5, the
; (4 pi a^2)^2 spin-marginalization factor in pdraw, and NO spurious
; pdraw rescale when nsamp is None.  sel_GWTC5_fixed.h5 has 1,433,314 rows
; with ndraw = 1,568,035,640; the old sel_GWTC5.h5 implied rates ~460x too
; high.  Everything else (prior, pop_config, sampler settings) unchanged so
; the selection fix is the only difference.
; Data are REAL GWTC-2.1/3/4/5 PE: 243 BBH events x 7000 samples.
; mock_GWTC5_noevo.txt is only the NUTS init / float32-recentering reference
; point, NOT a data-generating truth -- do not overlay it as "truth" on plots.
[run]
run_dir = realGWTC5_noevo_fullsel2
output_file_PE = PE_GWTC5_hr.h5
output_sel_file = sel_GWTC5_fixed.h5
prior = real_dat_noevo_fullsel.prior
pop_config_file = archive/mock_GWTC5_noevo.txt
nmcmc = 1800
nchain = 4
n_pe = 7000
evt_start = 0
evt_end = 243
mcmc_out = realGWTC5_noevo_fullsel2.nc
max_tree_depth = 7
dense_mass = false
target_accept_prob = 0.8
use_low_bump = true
smooth_tail_edge = true
