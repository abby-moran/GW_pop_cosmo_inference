; Full-freedom inference test on the endO5_val2 mock data products: all
; cosmological parameters (h, Omh2, w) AND mpisndot sampled.  Exercises the
; 2-D mass-function table (notes/2026-08-07-mass-table-2d.md) together with
; the traced-cosmology dL table.  Data files are symlinks into
; runs/endO5_val2 (no regeneration); truth is the noevo mock, so the
; posterior should recover w = -1 and mpisndot = 0.
[run]
pop_config_file = mock_O5_noevo.txt
run_dir = endO5_fullcosmo_evo2
ini_file = mock_O5_fullcosmo_evo2.ini
n_pe = 4000
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
prior = gwtc5_fullcosmo_evo.prior
nmcmc = 1800
nchain = 2
evt_start = 0
evt_end = 9000
mcmc_out = O5_fullcosmo_evo2.nc
