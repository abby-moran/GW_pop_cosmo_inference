; Real GWTC-5 catalog inference, no evolution (mpisndot = 0), cosmology fixed.
; Mimics abbys_runs/GWTC5_gc_reparam_noevo (confg_gc_reparam_noevo.ini) except:
;   - FULL selection set: all 488839 rows of sel_GWTC5.h5 (Abby's run used the
;     first half under the removed sel_fraction=0.5 convention; current
;     run_inf.py always uses the full set, so no sel_fraction key here).
;   - prior widened where Abby's posterior railed: a.low -1.65 -> -6,
;     b.low -2.1 -> -6, mpisn_ref.low 23.5 -> 20 (safe: mpisndot = 0 so
;     mpisn = mpisn_ref; canonical support floor is 20), log_fpl.high
;     ln(2) -> ln(10).  sigma's 0.05 hard floor and msigma_low's 0.5
;     narrow-feature floor also rail but are deliberate; left unchanged.
;   - nchain = 4 (Abby used 2).
; Data are REAL GWTC-2.1/3/4/5 PE: 243 BBH events x 7000 samples.
; mock_GWTC5_noevo.txt is only the NUTS init / float32-recentering reference
; point, NOT a data-generating truth -- do not overlay it as "truth" on plots.
[run]
run_dir = realGWTC5_noevo_fullsel
output_file_PE = PE_GWTC5_hr.h5
output_sel_file = sel_GWTC5.h5
prior = real_dat_noevo_fullsel.prior
pop_config_file = archive/mock_GWTC5_noevo.txt
nmcmc = 1800
nchain = 4
n_pe = 7000
evt_start = 0
evt_end = 243
mcmc_out = realGWTC5_noevo_fullsel.nc
max_tree_depth = 7
dense_mass = false
target_accept_prob = 0.8
use_low_bump = true
smooth_tail_edge = true
