; Real GWTC-5 catalog CONTROL run: LVK-style 'PowerLaw + 2 Peaks' mass model
; (arXiv 2605.27226, no spins) in place of the PISN model, cosmology fixed
; (h/Om/w), Madau-Dickinson redshift evolution unchanged.  Run with
; run_inf_lvk.py (NOT run_inf.py); the PISN-only keys (tail_anchor,
; use_low_bump, smooth_tail_edge) do not apply.
;
; Data: identical to the realGWTC5_noevo_259ev_* tail-anchor runs --
; PE_GWTC5_259ev.h5 (259 events x 7000) and sel_GWTC5_fixed.h5 (fixed
; selection normalization, 1,433,314 rows, ndraw = 1,568,035,640), symlinked
; from runs/realGWTC5_noevo_259ev/ (the single provenance copy; see
; run_configs/realGWTC5_noevo_fullsel_259ev.ini for how it was built).
;
; Redo of 2026-09-03 with the corrected GWTC-4/5 PE prior (see
; notes/2026-09-03-gwtc45-pe-prior-fix.md); the previous run is in runs/bad_z_prior/.
;
; No pop_config_file: real data, NUTS init_to_sample.
;
; Run (from scripts/):
;   sbatch call_inf_lvk_control.sh

[run]
run_dir = realGWTC5_lvk_control
output_file_PE = PE_GWTC5_259ev.h5
output_sel_file = sel_GWTC5_fixed.h5
prior = lvk_gwtc5_control.prior
nmcmc = 1800
nchain = 4
evt_start = 0
evt_end = None
mcmc_out = realGWTC5_lvk_control.nc
max_tree_depth = 7
dense_mass = false
target_accept_prob = 0.8
