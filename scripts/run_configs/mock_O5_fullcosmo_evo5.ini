; Same setup as endO5_fullcosmo_evo4 (h, Omh2, w, mpisndot free; dense_mass;
; max_tree_depth=10; scatter-free VJP) but with the pivoted mass-scale prior
; (mpisn_ref at zpivot=0.75).  See notes/2026-08-09-pivot-reparam.md.
; Separate run_dir / mcmc_out so this job cannot overwrite evo3/evo4.
; Same endO5_val2 data and draw count for an apples-to-apples mixing
; comparison.
[run]
pop_config_file = mock_O5_noevo.txt
run_dir = endO5_fullcosmo_evo5
ini_file = mock_O5_fullcosmo_evo5.ini
n_pe = 4000
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
prior = gwtc5_fullcosmo_evo_pivot.prior
nmcmc = 1800
nchain = 2
evt_start = 0
evt_end = 9000
mcmc_out = O5_fullcosmo_evo5.nc
max_tree_depth = 10
dense_mass = true
