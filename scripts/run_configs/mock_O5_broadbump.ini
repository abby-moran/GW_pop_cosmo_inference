; Control for mock_O5_narrowbump.ini.  Identical inference setup -- same
; prior (gwtc5_massonly.prior: cosmology and mpisndot pinned to truth), same
; nobs/nsamp/chains/draws -- run on the ORIGINAL endO5_val2 data, whose truth
; has msigma_low = 4.
;
; The pair (broadbump, narrowbump) differs in exactly one thing: the width of
; the true low-mass Gaussian, 4 vs 2.  Same injection pool, same prior, same
; pinned parameters, same seed.  So any difference in how well `a` is
; recovered is attributable to the bump's breadth and nothing else.
;
; Needs no reweighting: endO5_val2 already carries the msigma_low = 4 truth,
; so the PE and selection files are symlinked straight in.
;
; Purpose: endO5_fullcosmo_evo3 lost `a` (median 0.007 vs truth -0.9426) with
; `a` anti-correlated against msigma_low and log_flow, but that run also had
; free cosmology and mpisndot and only reached bulk ESS ~15.  This control
; separates "the bump eats `a`" from "evo3 just did not mix".
[run]
pop_config_file = mock_O5_noevo.txt
run_dir = endO5_broadbump
ini_file = mock_O5_broadbump.ini
n_pe = 4000
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
prior = gwtc5_massonly.prior
nmcmc = 1800
nchain = 2
evt_start = 0
evt_end = 9000
mcmc_out = O5_broadbump.nc
