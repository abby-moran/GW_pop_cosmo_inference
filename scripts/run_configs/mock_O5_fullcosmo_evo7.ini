; Fullcosmo evo7: same sampler / pivot+fpeak prior family as evo6, but the
; mock truth has msigma_low = 1.5 instead of 4.  Injection pool is the
; enlarged same-proposal file from endO5_w15pool (num_loops=70; see
; mock_O5_w15pool.ini), symlinked in by call_rwt_width15.sh -- not
; endO5_val2 (leave that alone for evo4/5/6).
;
; At width 1.5 on the ~355M-row pool, expect ~110k sel rows and
; max nobs ~14k (half-sel/4), so evt_end = 8000 has narrowbump-like margin.
; The msigma_low prior is tightened to [0.5, 2.5].
[run]
pop_config_file = mock_O5_width15.txt
output_file_inj = inj_mockGW5_SNR0.h5
ndet = 3
final_snr_threshold = 8
snr_threshold_0 = 0
sensitivity = 'aplus_PSD'
run_dir = endO5_fullcosmo_evo8
ini_file = mock_O5_fullcosmo_evo7.ini
snr_grid = snr_grid_aplus.npz
chunk_size = 2000000
num_tot    = 20000000
n_total    = 400000000
num_loops  = 70
n_pe = 4000
obs_file = obs_width15.h5
output_file_pe = PE_width15.h5
output_sel_file = sel_width15.h5
write_obs = True
new_sel = True
prior = ../../runs/priors_old/gwtc5_fullcosmo_evo_pivot_fpeak_w15.prior
nmcmc = 1800
nchain = 2
jitter_snr = True
m_min = 5.5
evt_start = 0
evt_end = 8000
mcmc_out = O5_fullcosmo_evo7_822.nc
max_tree_depth = 10
dense_mass = true

