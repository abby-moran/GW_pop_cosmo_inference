; Rerun of endO5_fullcosmo_evo2 (h, Omh2, w AND mpisndot free) with stronger
; sampler geometry.  evo2 validated the tabulated-selection fix (truth
; recovered, 0 divergences) but saturated max_tree_depth=7 in 100% of
; iterations with step sizes ~2e-3, leaving bulk ESS at 3-18 and r-hat up
; to 1.9.  Here dense_mass lets NUTS absorb the h/Omh2/mpisn/mpisndot
; covariance and max_tree_depth=10 gives trajectories room to U-turn.
; Same data (endO5_val2 symlinks), prior, and draw count as evo2, so the
; posteriors are directly comparable.
[run]
pop_config_file = mock_O5_noevo.txt
run_dir = endO5_fullcosmo_evo3
ini_file = mock_O5_fullcosmo_evo3.ini
n_pe = 4000
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
prior = gwtc5_fullcosmo_evo.prior
nmcmc = 1800
nchain = 2
evt_start = 0
evt_end = 9000
mcmc_out = O5_fullcosmo_evo3.nc
max_tree_depth = 10
dense_mass = true
