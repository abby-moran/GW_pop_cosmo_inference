; Validation rerun with the injection fixes of 2026-08-07 (see
; notes/2026-08-07-injection-pool-rejection-sampling.md): grid-max mass cap
; in gen_inj.py, rejection sampling (duplicate-free population draws), and
; normalized pdraw_sel.  num_loops=40 -> ~4e8 raw draws -> ~2.4e8 in-grid
; rows -> ~3e6 accepted population draws -> ~300k detections, comfortably
; supporting 9000 unique events and the 4*nobs selection n_eff criterion.
; num_tot stays at the production value and acts as a cap.
[run]
pop_config_file = mock_O5_noevo.txt
output_file_inj = inj_mockGW5_SNR0.h5
ndet = 3
final_snr_threshold = 8
snr_threshold_0 = 0
sensitivity = 'aplus_PSD'
run_dir = endO5_val2
ini_file = mock_O5_noevo_val2.ini
snr_grid = snr_grid_aplus.npz
chunk_size = 2000000
num_tot    = 20000000
n_total    = 300000000
num_loops  = 40
n_pe = 4000
obs_file = obs_noevo.h5
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
write_obs = True
new_sel = True
prior = gwtc5_cosmo.prior
nmcmc = 1800
nchain = 2
jitter_snr = True
m_min = 5.5
evt_start = 0
evt_end = 9000
mcmc_out = O5_val2.nc
