; End-to-end validation of the optimized model (intensity_models_fast with
; smooth_tail_edge=True and neff_penalty="mc_variance" defaults).
; Copy of mock_O5_noevo.ini with: its own run_dir, num_loops=3 so gen_inj.py
; produces exactly the n_total=3e7 injections reweight_res.py reads, and
; write_obs/new_sel=True to build the population from scratch.
[run]
pop_config_file = mock_O5_noevo.txt
output_file_inj = inj_mockGW5_SNR0.h5
ndet = 3
final_snr_threshold = 8
snr_threshold_0 = 0
sensitivity = 'aplus_PSD'
run_dir = endO5_val
ini_file = mock_O5_noevo_val.ini
snr_grid = snr_grid_aplus.npz
chunk_size = 40000
num_tot    = 20000000
n_total    = 30000000
num_loops  = 3
n_pe = 4000
obs_file = obs_noevo.h5
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
write_obs = True
new_sel = True
prior = gwtc5_cosmo.prior
nmcmc = 1800
nchain = 2
jitter_snr = True
m_min = 5.5
evt_start = 0
evt_end = 9000
mcmc_out = O5_val.nc
