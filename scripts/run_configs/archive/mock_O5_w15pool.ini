; Larger same-proposal injection pool for narrow-bump (msigma_low=1.5)
; reweights.  Identical proposal to endO5_val2 (powerlaw m1 on [2, m1_grid.max],
; SNR>0 keep-all); only num_loops grows 40 -> 70 so the pool has ~1.7x the
; rows (~355M, ~47 GB on ceph).  At width-1.5 rejection efficiency ~0.36%
; that yields ~110k sel rows and max nobs ~14k (half-sel/4), matching the
; narrowbump-scale margin.  See the injection-pool note and the width-1.5
; sizing analysis.  Do NOT overwrite endO5_val2 (in use by evo4/5/6).
[run]
pop_config_file = mock_O5_noevo.txt
output_file_inj = inj_mockGW5_SNR0.h5
ndet = 3
final_snr_threshold = 8
snr_threshold_0 = 0
sensitivity = 'aplus_PSD'
run_dir = endO5_w15pool
ini_file = mock_O5_w15pool.ini
snr_grid = snr_grid_aplus.npz
chunk_size = 2000000
num_tot    = 20000000
n_total    = 400000000
num_loops  = 70
n_pe = 4000
obs_file = obs_noevo.h5
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
write_obs = True
new_sel = True
prior = gwtc5_cosmo.prior
nmcmc = 1800
nchain = 2
jitter_snr = True
m_min = 5.5
evt_start = 0
evt_end = 9000
mcmc_out = O5_w15pool.nc
