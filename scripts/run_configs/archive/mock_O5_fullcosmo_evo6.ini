; Twin of endO5_fullcosmo_evo5 (pivot prior, scatter-free VJP, dense_mass,
; max_tree_depth=10) but sampling log_fpeak instead of log_flow for the
; low-mass bump amplitude.  See notes/2026-08-09-log-fpeak-parametrization.md
; and notes/2026-08-09-pivot-reparam.md.  Same endO5_val2 data and draw count
; as evo4/evo5 for an apples-to-apples mixing comparison.
[run]
pop_config_file = mock_O5_noevo.txt
run_dir = endO5_fullcosmo_evo6
ini_file = mock_O5_fullcosmo_evo6.ini
n_pe = 4000
output_file_pe = PE_noevo_vlowres.h5
output_sel_file = sel_noevo.h5
prior = gwtc5_fullcosmo_evo_pivot_fpeak.prior
nmcmc = 1800
nchain = 2
evt_start = 0
evt_end = 9000
mcmc_out = O5_fullcosmo_evo6.nc
max_tree_depth = 10
dense_mass = true
