; Narrow-bump degeneracy probe.  Identical to mock_O5_noevo_val2.ini except
; the truth population has msigma_low = 2 instead of 4
; (pop_configs/mock_O5_narrowbump.txt), and inference pins the cosmology and
; mpisndot (priors/gwtc5_massonly.prior).
;
; Width 2, not 1.  The population draws come from rejection sampling against a
; fixed injection pool, so acceptance ~ mean(w)/max(w) and a peakier target
; costs draws.  Measured over 40M pool rows (and confirmed against a real
; msigma_low=1 reweight, which yielded 363,816 draws vs 365,543 predicted):
;
;   msigma_low :   4.0      3.0      2.5      2.0      1.5      1.0
;   detections : 250,144  203,786  163,335  112,921   67,631   32,021
;   max nobs   :  31,268   25,473   20,417   14,115    8,454    4,003
;
; where max nobs = nsel/4 is what the model's 4*nobs neff_sel criterion allows
; (run_inf uses half the selection rows).  msigma_low = 1 supports only
; nobs = 4,003, so a 9000-event run there has the selection guard permanently
; active -- the first attempt at this config hit exactly that.  msigma_low = 2
; keeps nobs = 9000 well inside the limit while still breaking the degeneracy:
; Fisher sigma(a) is 0.289 at width 2 vs 2.548 at width 4 (0.154 at width 1),
; so the ~0.95 offset seen in endO5_fullcosmo_evo3 would show at >3 sigma.
;
; The pool cannot be stretched further: n_total is already clamped to the
; file's 212,041,265 rows, and num_loops is a gen_inj.py parameter, not a
; reweight_res.py one -- reaching val2's draw count at width 1 would need a
; ~14 billion row pool.
;
; Question: endO5_fullcosmo_evo3 recovered every parameter except `a`
; (median 0.007 vs truth -0.9426), with `a` strongly anti-correlated with
; msigma_low and log_flow.  At the val2 truth the bump is very broad
; (msigma_low = 4 at mp_low = 9.1, i.e. support from ~3 to ~17 Msun), which
; covers the whole range where the CO-core floor, the mbh_min taper and the
; `a` power law all operate.  A narrow bump (msigma_low = 1) confines the
; Gaussian to ~7-11 Msun and should free the rest of the low-mass range for
; `a` alone.  If `a` is then recovered, the degeneracy is driven by the bump's
; breadth; if `a` is still lost, the problem is structural in the mass model.
;
; Cosmology and mpisndot are pinned to truth deliberately: this is a
; source-frame mass-function question, and pinning them removes the h/Omh2/w
; nuisance directions that limited evo3 to bulk ESS ~15 (endO5_evo2, with
; cosmology pinned, reached ESS 118).  mpisndot = 0 also puts the model on the
; fast 1-D mass table.
;
; Reuses the SAME injection pool as endO5_val2 (symlinked from ceph): the pool
; is drawn from a broad proposal and is population independent, so only the
; reweighting step needs rerunning, not gen_inj.
[run]
pop_config_file = mock_O5_narrowbump.txt
output_file_inj = inj_mockGW5_SNR0.h5
ndet = 3
final_snr_threshold = 8
snr_threshold_0 = 0
sensitivity = 'aplus_PSD'
run_dir = endO5_narrowbump
ini_file = mock_O5_narrowbump.ini
snr_grid = snr_grid_aplus.npz
chunk_size = 2000000
num_tot    = 20000000
n_total    = 300000000
num_loops  = 40
n_pe = 4000
obs_file = obs_narrowbump.h5
output_file_pe = PE_narrowbump.h5
output_sel_file = sel_narrowbump.h5
write_obs = True
new_sel = True
prior = gwtc5_massonly.prior
nmcmc = 1800
nchain = 2
jitter_snr = True
m_min = 5.5
evt_start = 0
evt_end = 9000
mcmc_out = O5_narrowbump.nc
