; Real GWTC-5 catalog inference: 259 LVK events, no evolution (mpisndot = 0),
; cosmology fixed (h/Om/w).  PAIRING-FUNCTION RUN: pairing = lvk -- the PISN
; mass function with the LVK-style normalized q^beta pairing (beta is the q
; exponent, prior Uniform(-4, 7) as in realGWTC5_lvk_control).  Completes the
; 2x2 comparison design {PISN mass, LVK mass} x {mt, q^beta pairing}:
;   PISN + mt      = realGWTC5_noevo_259ev_{simplex,refz,perz}
;   LVK  + mt      = realGWTC5_lvk_mtpair
;   LVK  + q^beta  = realGWTC5_lvk_control
;   PISN + q^beta  = this run
; Everything else (data, tail_anchor = ref_z, sampler settings) is a clone of
; realGWTC5_noevo_259ev_refz.ini, so this run differs from refz ONLY in the
; pairing function + the matching beta prior.
;
; Data: PE_GWTC5_259ev.h5 (259 events x 7000; exact LVK GWTC-5 Default event
; list from the popsummary release; small-sample events drawn from
; C01:IMRPhenomXPHM via group_overrides -- zero with-replacement rows) and
; sel_GWTC5_fixed.h5 (fixed selection normalization, 1,433,314 rows,
; ndraw = 1,568,035,640).  Both are SYMLINKS into runs/realGWTC5_noevo_259ev/,
; which remains the single provenance copy (see
; run_configs/realGWTC5_noevo_fullsel_259ev.ini for how it was built).
;
; Redo of 2026-09-03 with the corrected GWTC-4/5 PE prior (see
; notes/2026-09-03-gwtc45-pe-prior-fix.md); the previous run is in runs/bad_z_prior/.
;
; No pop_config_file: real data, NUTS init_to_sample.
;
; Run (from scripts/):
;   sbatch call_inf_qpair.sh

[run]
run_dir = realGWTC5_noevo_259ev_qpair
output_file_PE = PE_GWTC5_259ev.h5
output_sel_file = sel_GWTC5_fixed.h5
prior = real_dat_noevo_qpair_r.prior
tail_anchor = ref_z
pairing = lvk
nmcmc = 1800
nchain = 4
evt_start = 0
evt_end = None
mcmc_out = realGWTC5_noevo_259ev_qpair.nc
max_tree_depth = 7
dense_mass = false
target_accept_prob = 0.8
use_low_bump = true
smooth_tail_edge = true
