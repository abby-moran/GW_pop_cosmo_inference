; Float64 verification of endO5_narrowbump_s2sel: same PE, sel, prior,
; sampler, and sel_fraction=1.0; only JAX_ENABLE_X64=1 differs (set in
; call_inf_narrowbump_s2sel_f64.sh).  Reuses s2sel PE/sel via symlinks.
[run]
pop_config_file = mock_O5_narrowbump.txt
output_file_inj = inj_mockGW5_SNR0.h5
ndet = 3
final_snr_threshold = 8
snr_threshold_0 = 0
sensitivity = 'aplus_PSD'
run_dir = endO5_narrowbump_s2sel_f64
ini_file = mock_O5_narrowbump_s2sel_f64.ini
snr_grid = snr_grid_aplus.npz
chunk_size = 2000000
num_tot    = 20000000
n_total    = 1500000000
num_loops  = 250
n_pe = 4000
obs_file = obs_narrowbump_s2.h5
output_file_pe = PE_narrowbump.h5
output_sel_file = sel_narrowbump_s2.h5
write_obs = True
new_sel = True
prior = gwtc5_massonly.prior
nmcmc = 1800
nchain = 2
jitter_snr = True
m_min = 5.5
evt_start = 0
evt_end = 9000
mcmc_out = O5_narrowbump_s2sel_f64.nc
max_tree_depth = 10
dense_mass = true
sel_fraction = 1.0
