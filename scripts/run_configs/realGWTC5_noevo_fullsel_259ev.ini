; 2026-09-03: PE file REGENERATED with the corrected GWTC-4/5 PE prior
; (bilby UniformSourceFrame x uniform-in-components; see
; notes/2026-09-03-gwtc45-pe-prior-fix.md), replacing the version now
; quarantined in runs/bad_z_prior/.  Same seed, same events and samples.
;
; Real GWTC-5 catalog inference, no evolution, FIXED EVENT LOADING: exactly
; the 259 BBH events of the official LVK GWTC-5 population analysis
; (arXiv:2605.27226), taken from the `events` / `event_sample_IDs` attrs of
; the popsummary release file (Zenodo 20292639) -- see [extract] below and
; scripts/extract_realGWTC5_259.py.
;
; Identical to realGWTC5_noevo_fullsel2 (same prior, pop_config, sampler
; settings, and the FIXED sel_GWTC5_fixed.h5 selection set, copied verbatim
; into this run dir) except for the PE input.  The old PE_GWTC5_hr.h5 had
; only 243 events:
;   - all 10 O1/O2 events missing (GWTC-2.1 glob was limited to GW190*);
;   - GW190521_030229, GW200129_065458, GW150914_095045 etc. silently
;     dropped because they have < 7000 PE samples (old code skipped any
;     event with n < PE_samps; here they are resampled WITH replacement
;     and flagged in the file);
;   - GW231026_130704 and GW231113_150041 missing entirely (they only
;     exist in the GWTC-4.1 release; the old run used GWTC-4.0);
;   - `evt` labels for GWTC-4/5 events were mangled (721_GW230601,
;     25_GW240413, with duplicate collisions).
; The new PE file also selects, per event, the posterior_samples group the
; LVK analysis used (popsummary event_sample_IDs), falling back to the
; release's own events_list_bbh_only.txt group when the popsummary group is
; absent from the file (4 GWTC-5 events where popsummary says C0*:Mixed but
; the Stable_Release-8 files only carry the individual waveform groups).
;
; Build the PE input (from scripts/):
;   uv run python extract_realGWTC5_259.py --config run_configs/realGWTC5_noevo_fullsel_259ev.ini
; Then run inference:
;   uv run python run_inf.py --config run_configs/realGWTC5_noevo_fullsel_259ev.ini
;
; Data are REAL GWTC-2.1/3/4.1/5 PE: 259 BBH events x 7000 samples.
; mock_GWTC5_noevo.txt is only the NUTS init / float32-recentering reference
; point, NOT a data-generating truth -- do not overlay it as "truth" on plots.

[run]
run_dir = realGWTC5_noevo_259ev
output_file_PE = PE_GWTC5_259ev.h5
output_sel_file = sel_GWTC5_fixed.h5
prior = real_dat_noevo_fullsel.prior
pop_config_file = archive/mock_GWTC5_noevo.txt
nmcmc = 1800
nchain = 4
n_pe = 7000
evt_start = 0
evt_end = None
mcmc_out = realGWTC5_noevo_259ev.nc
max_tree_depth = 7
dense_mass = false
target_accept_prob = 0.8
use_low_bump = true
smooth_tail_edge = true

[extract]
; Authoritative event list: 259 events + per-event sample groups.
popsummary_file = ../etc/gwtc5_populations_zenodo20292639/popsummary_files/gwtc5_updated_default_mmax_mass_TwoPeakBrokenPowerLawSmoothedMassDistribution_redshift_PowerLawRedshift_magnitude_iid_spin_magnitude_gaussian_tilt_iid_spin_orientation_popsummary_result.h5
; One release file per event; note GWTC-2.1 covers O1+O2+O3a (no GW190*
; restriction!) and O4a comes from the GWTC-4.1 release (not 4.0).
data_paths = ['/mnt/home/ccalvk/ceph/GWTC-2.1/IGWN-GWTC2p1-v2-*_PEDataRelease_mixed_nocosmo.h5',
              '/mnt/home/ccalvk/ceph/GWTC-3/IGWN-GWTC3p0-v2-*_PEDataRelease_mixed_nocosmo.h5',
              '/mnt/home/misi/ceph/rp.04/catalogs/GWTC-4p1/GWTC4p1-Stable_Release-3/18965dda8_5/bbh_only/IGWN-GWTC4p1-*-combined_PEDataRelease.hdf5',
              '/mnt/home/misi/ceph/rp.04/catalogs/GWTC-5/GWTC5-Stable_Release-8/4c51f4201_25/bbh_only/IGWN-GWTC5p0-*-combined_PEDataRelease.hdf5']
pe_samps = 7000
seed = 20260829
; These three events' LVK-prescribed C01:Mixed groups have < pe_samps raw
; samples (4478 / 1286 / 3194, capped by the small SEOBNRv4PHM runs).  Per
; user decision (2026-08-29) use the full C01:IMRPhenomXPHM posteriors
; (~150-200k samples) instead of resampling Mixed with replacement.
group_overrides = {'GW150914_095045': 'C01:IMRPhenomXPHM',
                   'GW190521_030229': 'C01:IMRPhenomXPHM',
                   'GW200129_065458': 'C01:IMRPhenomXPHM'}
zmax = 3.0
; Selection set: copied verbatim from the quarantined provenance dir
; (originally from the fullsel2 run; unaffected by the PE-prior bug; fixed
; extract_selection_samples, 1,433,314 rows, ndraw = 1,568,035,640).
sel_source = ../runs/bad_z_prior/realGWTC5_noevo_259ev/sel_GWTC5_fixed.h5
